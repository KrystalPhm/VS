```html
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daily Photo Blog</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      background:#081120;
      color:white;
      min-height:100vh;
      padding:40px 8%;
    }

    h1{
      text-align:center;
      font-size:46px;
      color:#5ea2ff;
      margin-bottom:10px;
    }

    .subtitle{
      text-align:center;
      color:#9db2d1;
      margin-bottom:45px;
      font-size:15px;
    }

    /* CALENDAR */

    .calendar-section{
      margin-bottom:50px;
    }

    .calendar-title{
      text-align:center;
      margin-bottom:25px;
      color:#5ea2ff;
      font-size:28px;
    }

    .calendar{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
      gap:15px;
    }

    .month{
      background:#101b2f;
      border:1px solid rgba(255,255,255,0.05);
      padding:25px;
      border-radius:18px;
      text-align:center;
      font-weight:600;
      color:#dce8ff;
      transition:0.3s;
      cursor:pointer;
    }

    .month:hover{
      background:#1d4ed8;
      transform:translateY(-4px);
    }

    /* Upload Box */

    .upload-box{
      background:#101b2f;
      border-radius:24px;
      padding:35px;
      margin-bottom:50px;
      text-align:center;
      border:2px dashed #28456d;
      box-shadow:0 10px 25px rgba(0,0,0,0.25);
    }

    .upload-box h2{
      margin-bottom:20px;
      color:#dce8ff;
    }

    .upload-box input[type="file"]{
      color:white;
      margin-top:10px;
    }

    .caption-input{
      margin-top:18px;
      width:80%;
      padding:14px;
      border:none;
      border-radius:12px;
      outline:none;
      background:#18263d;
      color:white;
      font-size:15px;
    }

    .caption-input::placeholder{
      color:#90a4c5;
    }

    button{
      margin-top:22px;
      padding:13px 30px;
      border:none;
      border-radius:30px;
      background:#1d4ed8;
      color:white;
      cursor:pointer;
      font-size:15px;
      font-weight:500;
      transition:0.3s;
    }

    button:hover{
      background:#2563eb;
      transform:translateY(-2px);
    }

    /* Gallery */

    .gallery{
      display:flex;
      flex-direction:column;
      gap:30px;
    }

    .card{
      background:#101b2f;
      border-radius:20px;
      overflow:hidden;
      position:relative;
      border:1px solid rgba(255,255,255,0.05);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
      box-shadow:0 12px 30px rgba(0,0,0,0.3);
    }

    /* Album Grid */

    .album-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:4px;
      padding:4px;
    }

    .album-grid img{
      width:100%;
      height:220px;
      object-fit:cover;
      border-radius:10px;
      cursor:pointer;
      transition:0.3s;
    }

    .album-grid img:hover{
      transform:scale(1.02);
    }

    .album-grid img:only-child{
      grid-column:span 2;
      height:420px;
    }

    .album-grid img:nth-child(3):last-child{
      grid-column:span 2;
    }

    /* Nội dung */

    .content{
      padding:20px;
    }

    .date{
      color:#5ea2ff;
      font-size:16px;
      margin-bottom:14px;
      font-weight:600;
    }

    .caption{
      color:#dce6f8;
      font-size:15px;
      line-height:1.7;
      padding:12px;
      background:#18263d;
      border-radius:12px;
      margin-bottom:10px;
    }

    /* Delete */

    .delete-btn{
      position:absolute;
      top:12px;
      right:12px;
      width:42px;
      height:42px;
      border:none;
      border-radius:50%;
      background:rgba(0,0,0,0.65);
      color:white;
      font-size:18px;
      cursor:pointer;
      z-index:5;
      margin:0;
      padding:0;
      transition:0.3s;
    }

    .delete-btn:hover{
      background:#ef4444;
      transform:scale(1.08);
    }

    /* Fullscreen */

    .modal{
      display:none;
      position:fixed;
      z-index:999;
      left:0;
      top:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.9);
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .modal img{
      max-width:90%;
      max-height:90%;
      border-radius:14px;
    }

    .modal.active{
      display:flex;
    }

    footer{
      text-align:center;
      margin-top:70px;
      color:#7f95b8;
      font-size:14px;
    }

    @media(max-width:768px){

      body{
        padding:25px 5%;
      }

      h1{
        font-size:34px;
      }

      .caption-input{
        width:100%;
      }

      .upload-box{
        padding:25px;
      }

    }

  </style>
</head>

<body>

  <h1>My Daily Moments</h1>

  <p class="subtitle">
    Blog lưu giữ khoảnh khắc mỗi ngày ✨
  </p>

  <!-- CALENDAR -->

  <section class="calendar-section">

    <h2 class="calendar-title">
      📅 Calendar 2026
    </h2>

    <div class="calendar">

      <div class="month">JAN</div>
      <div class="month">FEB</div>
      <div class="month">MAR</div>
      <div class="month">APR</div>
      <div class="month">MAY</div>
      <div class="month">JUN</div>
      <div class="month">JUL</div>
      <div class="month">AUG</div>
      <div class="month">SEP</div>
      <div class="month">OCT</div>
      <div class="month">NOV</div>
      <div class="month">DEC</div>

    </div>

  </section>

  <!-- Upload -->

  <div class="upload-box">

    <h2>Đăng Album Hôm Nay</h2>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
      multiple
    >

    <br>

    <input
      type="text"
      id="captionInput"
      class="caption-input"
      placeholder="Viết caption cho lần đăng này..."
    >

    <br>

    <button onclick="addPhoto()">
      Đăng Album
    </button>

  </div>

  <!-- Gallery -->

  <div class="gallery" id="gallery"></div>

  <!-- Fullscreen -->

  <div class="modal" id="modal" onclick="closeImage()">

    <img id="modalImg">

  </div>

  <footer>
    © 2026 Daily Photo Blog
  </footer>

  <script>

    // lưu album theo ngày
    const albums = {};

    // đăng album
    function addPhoto(){

      const imageInput =
        document.getElementById("imageInput");

      const captionInput =
        document.getElementById("captionInput");

      const gallery =
        document.getElementById("gallery");

      const files = imageInput.files;

      // kiểm tra ảnh
      if(files.length === 0){

        alert("Vui lòng chọn ảnh!");
        return;
      }

      // giới hạn 20 ảnh
      if(files.length > 20){

        alert("Chỉ được đăng tối đa 20 ảnh!");
        return;
      }

      // lấy ngày hiện tại
      const now = new Date();

      const todayKey =
        now.getFullYear() + "-" +
        (now.getMonth()+1) + "-" +
        now.getDate();

      const todayText =
        now.toLocaleDateString("vi-VN");

      // nếu chưa có album ngày đó
      if(!albums[todayKey]){

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `

          <button class="delete-btn"
            onclick="deletePost(this)">
            ✕
          </button>

          <div class="album-grid"></div>

          <div class="content">

            <div class="date">
              📅 ${todayText}
            </div>

            <div class="caption-list"></div>

          </div>

        `;

        gallery.prepend(card);

        albums[todayKey] = card;
      }

      // album hiện tại
      const currentAlbum = albums[todayKey];

      const imageGrid =
        currentAlbum.querySelector(".album-grid");

      const captionList =
        currentAlbum.querySelector(".caption-list");

      // caption riêng từng lần đăng
      const captionItem =
        document.createElement("div");

      captionItem.className = "caption";

      captionItem.innerHTML = `
        ✨ ${captionInput.value || "Không có caption"}
      `;

      captionList.prepend(captionItem);

      // thêm ảnh
      Array.from(files).forEach(file => {

        const reader = new FileReader();

        reader.onload = function(e){

          const img =
            document.createElement("img");

          img.src = e.target.result;

          img.setAttribute(
            "onclick",
            `openImage('${e.target.result}')`
          );

          imageGrid.prepend(img);

        };

        reader.readAsDataURL(file);

      });

      // reset
      imageInput.value = "";
      captionInput.value = "";

    }

    // xóa album
    function deletePost(button){

      const card =
        button.closest(".card");

      card.remove();

    }

    // mở fullscreen
    function openImage(src){

      const modal =
        document.getElementById("modal");

      const modalImg =
        document.getElementById("modalImg");

      modalImg.src = src;

      modal.classList.add("active");

    }

    // đóng fullscreen
    function closeImage(){

      document
        .getElementById("modal")
        .classList.remove("active");

    }

  </script>

</body>
</html>
```
