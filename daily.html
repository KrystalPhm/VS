```html
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daily Photo Blog</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      background:#081120;
      color:white;
      padding:40px 8%;
      min-height:100vh;
    }

    h1{
      text-align:center;
      font-size:46px;
      color:#5ea2ff;
      margin-bottom:10px;
    }

    .subtitle{
      text-align:center;
      color:#9db2d1;
      margin-bottom:45px;
      font-size:15px;
    }

    /* Upload Box */

    .upload-box{
      background:#101b2f;
      border-radius:22px;
      padding:35px;
      margin-bottom:50px;
      text-align:center;
      border:2px dashed #28456d;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    .upload-box h2{
      margin-bottom:20px;
      color:#dce8ff;
    }

    .upload-box input[type="file"]{
      margin-top:10px;
      color:white;
    }

    .caption-input{
      margin-top:18px;
      padding:14px;
      width:80%;
      border-radius:12px;
      border:none;
      outline:none;
      background:#18263d;
      color:white;
      font-size:15px;
    }

    .caption-input::placeholder{
      color:#8ea3c7;
    }

    button{
      margin-top:22px;
      padding:13px 30px;
      border:none;
      border-radius:30px;
      background:#1d4ed8;
      color:white;
      cursor:pointer;
      font-size:15px;
      font-weight:500;
      transition:0.3s;
    }

    button:hover{
      background:#2563eb;
      transform:translateY(-2px);
    }

    /* Gallery */

    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:25px;
    }

    .card{
      background:#101b2f;
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.05);
      transition:0.3s;
      position:relative;
    }

    .card:hover{
      transform:translateY(-5px);
      box-shadow:0 12px 25px rgba(0,0,0,0.3);
    }

    .card img{
      width:100%;
      height:300px;
      object-fit:cover;
      display:block;
    }

    .content{
      padding:18px;
    }

    .date{
      color:#5ea2ff;
      font-size:14px;
      margin-bottom:8px;
    }

    .caption{
      color:#dce6f8;
      font-size:15px;
      line-height:1.5;
      word-break:break-word;
    }

    /* Delete Button */

    .delete-btn{
      position:absolute;
      top:12px;
      right:12px;
      width:40px;
      height:40px;
      border:none;
      border-radius:50%;
      background:rgba(0,0,0,0.65);
      color:white;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
      margin:0;
      padding:0;
    }

    .delete-btn:hover{
      background:#ef4444;
      transform:scale(1.08);
    }

    footer{
      text-align:center;
      margin-top:70px;
      color:#7f95b8;
      font-size:14px;
    }

    /* Responsive */

    @media(max-width:768px){

      body{
        padding:25px 5%;
      }

      h1{
        font-size:34px;
      }

      .caption-input{
        width:100%;
      }

      .upload-box{
        padding:25px;
      }

    }

  </style>
</head>

<body>

  <h1>My Daily Moments</h1>

  <p class="subtitle">
    Blog đơn giản để lưu lại hình ảnh mỗi ngày ✨
  </p>

  <!-- Upload -->
  <div class="upload-box">

    <h2>Đăng Hình Hôm Nay</h2>

    <!-- Chọn nhiều ảnh -->
    <input
      type="file"
      id="imageInput"
      accept="image/*"
      multiple
    >

    <br>

    <!-- Caption -->
    <input
      type="text"
      id="captionInput"
      class="caption-input"
      placeholder="Viết caption cho hôm nay..."
    >

    <br>

    <!-- Button -->
    <button onclick="addPhoto()">
      Đăng ảnh
    </button>

  </div>

  <!-- Gallery -->
  <div class="gallery" id="gallery">

    <!-- Sample -->
    <div class="card">

      <button class="delete-btn" onclick="deletePost(this)">
        ✕
      </button>

      <img
        src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop"
      >

      <div class="content">

        <div class="date">
          16/06/2026
        </div>

        <div class="caption">
          Một ngày bình yên 🌙
        </div>

      </div>

    </div>

  </div>

  <footer>
    © 2026 Daily Photo Blog
  </footer>

  <script>

    function addPhoto(){

      const imageInput = document.getElementById("imageInput");
      const captionInput = document.getElementById("captionInput");
      const gallery = document.getElementById("gallery");

      const files = imageInput.files;

      // Kiểm tra có ảnh chưa
      if(files.length === 0){
        alert("Vui lòng chọn ảnh!");
        return;
      }

      // Giới hạn tối đa 20 ảnh
      if(files.length > 20){
        alert("Chỉ được đăng tối đa 20 ảnh!");
        return;
      }

      // Lặp từng ảnh
      Array.from(files).forEach(file => {

        const reader = new FileReader();

        reader.onload = function(e){

          const card = document.createElement("div");
          card.className = "card";

          const today = new Date().toLocaleDateString("vi-VN");

          card.innerHTML = `

            <button class="delete-btn" onclick="deletePost(this)">
              ✕
            </button>

            <img src="${e.target.result}">

            <div class="content">

              <div class="date">
                ${today}
              </div>

              <div class="caption">
                ${captionInput.value || "Không có caption"}
              </div>

            </div>

          `;

          // Thêm bài mới lên đầu
          gallery.prepend(card);

        };

        reader.readAsDataURL(file);

      });

      // Reset
      imageInput.value = "";
      captionInput.value = "";

    }

    // Xóa bài đăng
    function deletePost(button){

      const card = button.closest(".card");

      card.remove();

    }

  </script>

</body>
</html>
```
