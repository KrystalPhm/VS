<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Photo Blog</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#081120;
  color:white;
  padding:40px 8%;
}

h1{
  text-align:center;
  font-size:48px;
  color:#5ea2ff;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#8ea6cc;
  margin-bottom:50px;
}

/* CALENDAR */

.calendar{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:15px;
}

.month,
.day-box{
  background:#101b2f;
  border:1px solid rgba(255,255,255,0.05);
  padding:22px;
  border-radius:18px;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
  font-weight:600;
}

.month:hover,
.day-box:hover{
  background:#1d4ed8;
  transform:translateY(-4px);
}

.days-container{
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(80px,1fr));
  gap:12px;
}

/* UPLOAD */

.upload-box{
  background:#101b2f;
  border-radius:24px;
  padding:35px;
  margin:50px 0;
  text-align:center;
  border:2px dashed #28456d;
}

.upload-box h2{
  margin-bottom:20px;
}

.caption-input{
  margin-top:18px;
  width:80%;
  padding:14px;
  border:none;
  border-radius:12px;
  outline:none;
  background:#18263d;
  color:white;
  font-size:15px;
}

button{
  margin-top:22px;
  padding:13px 30px;
  border:none;
  border-radius:30px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  font-weight:600;
}

/* GALLERY */

.gallery{
  display:flex;
  flex-direction:column;
  gap:30px;
}

.card{
  background:#101b2f;
  border-radius:20px;
  padding:20px;
}

.date{
  color:#5ea2ff;
  font-size:22px;
  margin-bottom:20px;
  font-weight:600;
}

.post{
  margin-bottom:40px;
}

.caption{
  background:#18263d;
  padding:14px;
  border-radius:12px;
  margin-bottom:14px;
  line-height:1.7;
}

/* IMAGE GRID */

.album-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.album-grid img{
  width:100%;
  height:250px;
  object-fit:cover;
  border-radius:12px;
  cursor:pointer;
  transition:0.3s;
}

.album-grid img:hover{
  transform:scale(1.02);
}

.album-grid img:only-child{
  grid-column:span 2;
  height:420px;
}

/* FULLSCREEN */

.modal{
  display:none;
  position:fixed;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal.active{
  display:flex;
}

.modal img{
  max-width:90%;
  max-height:90%;
  border-radius:14px;
}

@media(max-width:768px){

  body{
    padding:25px 5%;
  }

  h1{
    font-size:34px;
  }

  .caption-input{
    width:100%;
  }

  .album-grid{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<h1>My Daily Moments</h1>

<p class="subtitle">
  Blog lưu giữ khoảnh khắc mỗi ngày ✨
</p>

<!-- CALENDAR -->

<div class="calendar">

  <div class="month" data-month="1">JAN</div>
  <div class="month" data-month="2">FEB</div>
  <div class="month" data-month="3">MAR</div>
  <div class="month" data-month="4">APR</div>
  <div class="month" data-month="5">MAY</div>
  <div class="month" data-month="6">JUN</div>
  <div class="month" data-month="7">JUL</div>
  <div class="month" data-month="8">AUG</div>
  <div class="month" data-month="9">SEP</div>
  <div class="month" data-month="10">OCT</div>
  <div class="month" data-month="11">NOV</div>
  <div class="month" data-month="12">DEC</div>

</div>

<div class="days-container" id="daysContainer"></div>

<!-- UPLOAD -->

<div class="upload-box">

  <h2>Đăng Album Hôm Nay</h2>

  <input
    type="file"
    id="imageInput"
    multiple
    accept="image/*"
  >

  <br>

  <input
    type="text"
    id="captionInput"
    class="caption-input"
    placeholder="Viết caption..."
  >

  <br>

  <button onclick="addPhoto()">
    Đăng Album
  </button>

</div>

<!-- GALLERY -->

<div class="gallery" id="gallery"></div>

<!-- MODAL -->

<div class="modal" id="modal" onclick="closeImage()">

  <img id="modalImg">

</div>

<script>

const albums = {};


// MONTH CLICK

document.querySelectorAll(".month")
.forEach(month=>{

  month.onclick = ()=>{

    const monthNumber =
      parseInt(month.dataset.month);

    showDays(monthNumber);

  };

});


// SHOW DAYS

function showDays(month){

  const daysContainer =
    document.getElementById("daysContainer");

  daysContainer.innerHTML = "";

  const totalDays =
    new Date(2026, month, 0).getDate();

  for(let day = 1; day <= totalDays; day++){

    const key =
      `2026-${month}-${day}`;

    const dayBox =
      document.createElement("div");

    dayBox.className = "day-box";

    dayBox.innerHTML = day;

    // highlight ngày có ảnh

    if(albums[key]){

      dayBox.style.border =
        "2px solid #5ea2ff";

    }

    dayBox.onclick = ()=>{

      showAlbum(key);

    };

    daysContainer.appendChild(dayBox);

  }

}


// ADD PHOTO

async function addPhoto(){

  const imageInput =
    document.getElementById("imageInput");

  const captionInput =
    document.getElementById("captionInput");

  const files =
    Array.from(imageInput.files);

  if(files.length === 0){

    alert("Vui lòng chọn ảnh!");
    return;

  }

  if(files.length > 20){

    alert("Chỉ được đăng tối đa 20 ảnh!");
    return;

  }

  const now = new Date();

  const year = now.getFullYear();

  const month = now.getMonth() + 1;

  const day = now.getDate();

  const key =
    `${year}-${month}-${day}`;

  // tạo ngày

  if(!albums[key]){

    albums[key] = [];

  }

  // đọc ảnh đúng cách

  const imagePromises =
    files.map(file=>{

      return new Promise(resolve=>{

        const reader =
          new FileReader();

        reader.onload = e=>{

          resolve(e.target.result);

        };

        reader.readAsDataURL(file);

      });

    });

  const images =
    await Promise.all(imagePromises);

  const post = {

    uploadTime:
      now.getTime(),

    time:
      now.toLocaleTimeString("vi-VN"),

    caption:
      captionInput.value || "Không có caption",

    images:
      images

  };

  albums[key].push(post);

  renderAll();

  imageInput.value = "";

  captionInput.value = "";

}


// RENDER ALL

function renderAll(){

  const gallery =
    document.getElementById("gallery");

  gallery.innerHTML = "";

  const sortedKeys =
    Object.keys(albums)
    .sort((a,b)=>
      new Date(a) - new Date(b)
    );

  sortedKeys.forEach(key=>{

    renderDay(key);

  });

}


// RENDER DAY

function renderDay(key){

  const gallery =
    document.getElementById("gallery");

  const card =
    document.createElement("div");

  card.className = "card";

  const date =
    document.createElement("div");

  date.className = "date";

  date.innerHTML =
    `📅 ${key}`;

  card.appendChild(date);

  // sort cũ -> mới

  albums[key]
  .sort((a,b)=>
    a.uploadTime - b.uploadTime
  );

  albums[key].forEach(post=>{

    const postDiv =
      document.createElement("div");

    postDiv.className = "post";

    // caption

    const caption =
      document.createElement("div");

    caption.className = "caption";

    caption.innerHTML = `
      🕒 ${post.time}
      <br><br>
      ✨ ${post.caption}
    `;

    postDiv.appendChild(caption);

    // images

    const grid =
      document.createElement("div");

    grid.className = "album-grid";

    post.images.forEach(src=>{

      const img =
        document.createElement("img");

      img.src = src;

      img.onclick = ()=>{

        openImage(src);

      };

      grid.appendChild(img);

    });

    postDiv.appendChild(grid);

    card.appendChild(postDiv);

  });

  gallery.appendChild(card);

}


// SHOW SINGLE DAY

function showAlbum(key){

  const gallery =
    document.getElementById("gallery");

  gallery.innerHTML = "";

  if(!albums[key]){

    gallery.innerHTML = `
      <div class="card">
        <div class="date">
          📅 ${key}
        </div>

        <div class="caption">
          Chưa có ảnh trong ngày này
        </div>
      </div>
    `;

    return;

  }

  renderDay(key);

}


// OPEN IMAGE

function openImage(src){

  const modal =
    document.getElementById("modal");

  const modalImg =
    document.getElementById("modalImg");

  modalImg.src = src;

  modal.classList.add("active");

}


// CLOSE IMAGE

function closeImage(){

  document
    .getElementById("modal")
    .classList.remove("active");

}

</script>

</body>
</html>
