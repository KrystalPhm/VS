<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy
}
from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
}
from "https://www.gstatic.com/firebasejs/12.15.0/firebase-storage.js";


// FIREBASE CONFIG

const firebaseConfig = {

  apiKey: "AIzaSyDhU9Nouh8tDVFBpnDS2a24nVE-CFdAvv8",

  authDomain: "daily-moment-blog.firebaseapp.com",

  projectId: "daily-moment-blog",

  storageBucket: "daily-moment-blog.firebasestorage.app",

  messagingSenderId: "131295013073",

  appId: "1:131295013073:web:dfbe2e6272a3e9b8863df0",

  measurementId: "G-XM0FREXCSV"

};


// INIT

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const storage = getStorage(app);


// DATA

const albums = {};


// MONTH CLICK

document.querySelectorAll(".month")
.forEach(month=>{

  month.onclick = ()=>{

    const monthNumber =
      parseInt(month.dataset.month);

    showDays(monthNumber);

  };

});


// SHOW DAYS

function showDays(month){

  const daysContainer =
    document.getElementById("daysContainer");

  daysContainer.innerHTML = "";

  const totalDays =
    new Date(2026, month, 0).getDate();

  for(let day = 1; day <= totalDays; day++){

    const key =
      `2026-${month}-${day}`;

    const dayBox =
      document.createElement("div");

    dayBox.className = "day-box";

    dayBox.innerHTML = day;

    if(albums[key]){

      dayBox.style.border =
        "2px solid #5ea2ff";

    }

    dayBox.onclick = ()=>{

      showAlbum(key);

    };

    daysContainer.appendChild(dayBox);

  }

}


// ADD PHOTO

window.addPhoto = async function(){

  const imageInput =
    document.getElementById("imageInput");

  const captionInput =
    document.getElementById("captionInput");

  const files =
    Array.from(imageInput.files);

  if(files.length === 0){

    alert("Vui lòng chọn ảnh!");

    return;

  }

  if(files.length > 20){

    alert("Chỉ được đăng tối đa 20 ảnh!");

    return;

  }

  const now = new Date();

  const year = now.getFullYear();

  const month = now.getMonth() + 1;

  const day = now.getDate();

  const key =
    `${year}-${month}-${day}`;

  const imageUrls = [];

  // UPLOAD ALL IMAGES

  for(const file of files){

    const fileName =
      Date.now() + "-" + file.name;

    const storageRef =
      ref(storage, "albums/" + fileName);

    await uploadBytes(storageRef, file);

    const downloadURL =
      await getDownloadURL(storageRef);

    imageUrls.push(downloadURL);

  }

  // SAVE FIRESTORE

  const postData = {

    dateKey: key,

    uploadTime:
      now.getTime(),

    time:
      now.toLocaleTimeString("vi-VN"),

    caption:
      captionInput.value || "Không có caption",

    images:
      imageUrls

  };

  await addDoc(
    collection(db, "posts"),
    postData
  );

  // LOCAL RENDER

  if(!albums[key]){

    albums[key] = [];

  }

  albums[key].push(postData);

  renderAll();

  imageInput.value = "";

  captionInput.value = "";

  alert("Đăng album thành công!");

};


// LOAD POSTS

async function loadPosts(){

  const q =
    query(
      collection(db, "posts"),
      orderBy("uploadTime", "asc")
    );

  const querySnapshot =
    await getDocs(q);

  querySnapshot.forEach(doc=>{

    const post = doc.data();

    if(!albums[post.dateKey]){

      albums[post.dateKey] = [];

    }

    albums[post.dateKey].push(post);

  });

  renderAll();

}

loadPosts();


// RENDER ALL

function renderAll(){

  const gallery =
    document.getElementById("gallery");

  gallery.innerHTML = "";

  const sortedKeys =
    Object.keys(albums)
    .sort((a,b)=>
      new Date(a) - new Date(b)
    );

  sortedKeys.forEach(key=>{

    renderDay(key);

  });

}


// RENDER DAY

function renderDay(key){

  const gallery =
    document.getElementById("gallery");

  const card =
    document.createElement("div");

  card.className = "card";

  const date =
    document.createElement("div");

  date.className = "date";

  date.innerHTML =
    `📅 ${key}`;

  card.appendChild(date);

  albums[key]
  .sort((a,b)=>
    a.uploadTime - b.uploadTime
  );

  albums[key].forEach(post=>{

    const postDiv =
      document.createElement("div");

    postDiv.className = "post";

    const caption =
      document.createElement("div");

    caption.className = "caption";

    caption.innerHTML = `
      🕒 ${post.time}
      <br><br>
      ✨ ${post.caption}
    `;

    postDiv.appendChild(caption);

    const grid =
      document.createElement("div");

    grid.className = "album-grid";

    post.images.forEach(src=>{

      const img =
        document.createElement("img");

      img.src = src;

      img.onclick = ()=>{

        openImage(src);

      };

      grid.appendChild(img);

    });

    postDiv.appendChild(grid);

    card.appendChild(postDiv);

  });

  gallery.appendChild(card);

}


// SHOW SINGLE DAY

function showAlbum(key){

  const gallery =
    document.getElementById("gallery");

  gallery.innerHTML = "";

  if(!albums[key]){

    gallery.innerHTML = `

      <div class="card">

        <div class="date">
          📅 ${key}
        </div>

        <div class="caption">
          Chưa có ảnh trong ngày này
        </div>

      </div>

    `;

    return;

  }

  renderDay(key);

}


// OPEN IMAGE

window.openImage = function(src){

  const modal =
    document.getElementById("modal");

  const modalImg =
    document.getElementById("modalImg");

  modalImg.src = src;

  modal.classList.add("active");

}


// CLOSE IMAGE

window.closeImage = function(){

  document
    .getElementById("modal")
    .classList.remove("active");

}

</script>
