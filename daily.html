```html
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Photo Blog</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      background:#081120;
      color:white;
      min-height:100vh;
      padding:40px 8%;
    }

    h1{
      text-align:center;
      font-size:48px;
      color:#5ea2ff;
      margin-bottom:10px;
    }

    .subtitle{
      text-align:center;
      color:#9db2d1;
      margin-bottom:50px;
      font-size:15px;
    }

    /* CALENDAR */

    .calendar-section{
      margin-bottom:50px;
    }

    .calendar-title{
      text-align:center;
      margin-bottom:25px;
      color:#5ea2ff;
      font-size:28px;
    }

    .calendar{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
      gap:15px;
    }

    .month,
    .day-box{
      background:#101b2f;
      border:1px solid rgba(255,255,255,0.05);
      padding:22px;
      border-radius:18px;
      text-align:center;
      font-weight:600;
      color:#dce8ff;
      cursor:pointer;
      transition:0.3s;
    }

    .month:hover,
    .day-box:hover{
      background:#1d4ed8;
      transform:translateY(-4px);
    }

    .days-container{
      margin-top:20px;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(80px,1fr));
      gap:12px;
    }

    /* Upload */

    .upload-box{
      background:#101b2f;
      border-radius:24px;
      padding:35px;
      margin-bottom:50px;
      text-align:center;
      border:2px dashed #28456d;
      box-shadow:0 10px 25px rgba(0,0,0,0.25);
    }

    .upload-box h2{
      margin-bottom:20px;
      color:#dce8ff;
    }

    input[type="file"]{
      color:white;
      margin-top:10px;
    }

    .caption-input{
      margin-top:18px;
      width:80%;
      padding:14px;
      border:none;
      border-radius:12px;
      outline:none;
      background:#18263d;
      color:white;
      font-size:15px;
    }

    .caption-input::placeholder{
      color:#90a4c5;
    }

    button{
      margin-top:22px;
      padding:13px 30px;
      border:none;
      border-radius:30px;
      background:#1d4ed8;
      color:white;
      cursor:pointer;
      font-size:15px;
      font-weight:500;
      transition:0.3s;
    }

    button:hover{
      background:#2563eb;
      transform:translateY(-2px);
    }

    /* Gallery */

    .gallery{
      display:flex;
      flex-direction:column;
      gap:30px;
    }

    .card{
      background:#101b2f;
      border-radius:20px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.05);
      padding:20px;
    }

    .date{
      color:#5ea2ff;
      font-size:18px;
      margin-bottom:20px;
      font-weight:600;
    }

    .post-block{
      margin-bottom:35px;
    }

    .caption{
      color:#dce6f8;
      font-size:15px;
      line-height:1.7;
      padding:14px;
      background:#18263d;
      border-radius:12px;
      margin-bottom:14px;
    }

    /* Album Grid */

    .album-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:6px;
    }

    .album-grid img{
      width:100%;
      height:240px;
      object-fit:cover;
      border-radius:12px;
      cursor:pointer;
      transition:0.3s;
    }

    .album-grid img:hover{
      transform:scale(1.02);
    }

    .album-grid img:only-child{
      grid-column:span 2;
      height:420px;
    }

    .album-grid img:nth-child(3):last-child{
      grid-column:span 2;
    }

    /* Fullscreen */

    .modal{
      display:none;
      position:fixed;
      z-index:999;
      left:0;
      top:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.9);
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .modal.active{
      display:flex;
    }

    .modal img{
      max-width:90%;
      max-height:90%;
      border-radius:16px;
    }

    footer{
      text-align:center;
      margin-top:70px;
      color:#7f95b8;
      font-size:14px;
    }

    @media(max-width:768px){

      body{
        padding:25px 5%;
      }

      h1{
        font-size:34px;
      }

      .caption-input{
        width:100%;
      }

      .album-grid{
        grid-template-columns:1fr;
      }

      .album-grid img{
        height:260px;
      }

    }

  </style>
</head>

<body>

  <h1>My Daily Moments</h1>

  <p class="subtitle">
    Blog lưu giữ khoảnh khắc mỗi ngày ✨
  </p>

  <!-- CALENDAR -->

  <section class="calendar-section">

    <h2 class="calendar-title">
      📅 Calendar 2026
    </h2>

    <div class="calendar">

      <div class="month" data-month="1">JAN</div>
      <div class="month" data-month="2">FEB</div>
      <div class="month" data-month="3">MAR</div>
      <div class="month" data-month="4">APR</div>
      <div class="month" data-month="5">MAY</div>
      <div class="month" data-month="6">JUN</div>
      <div class="month" data-month="7">JUL</div>
      <div class="month" data-month="8">AUG</div>
      <div class="month" data-month="9">SEP</div>
      <div class="month" data-month="10">OCT</div>
      <div class="month" data-month="11">NOV</div>
      <div class="month" data-month="12">DEC</div>

    </div>

    <div class="days-container" id="daysContainer"></div>

  </section>

  <!-- UPLOAD -->

  <div class="upload-box">

    <h2>Đăng Album Hôm Nay</h2>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
      multiple
    >

    <br>

    <input
      type="text"
      id="captionInput"
      class="caption-input"
      placeholder="Viết caption cho lần đăng này..."
    >

    <br>

    <button onclick="addPhoto()">
      Đăng Album
    </button>

  </div>

  <!-- GALLERY -->

  <div class="gallery" id="gallery"></div>

  <!-- MODAL -->

  <div class="modal" id="modal" onclick="closeImage()">

    <img id="modalImg">

  </div>

  <footer>
    © 2026 Daily Photo Blog
  </footer>

  <script>

    // DATABASE

    const albums = {};

    // MONTH CLICK

    const monthButtons =
      document.querySelectorAll(".month");

    monthButtons.forEach(button=>{

      button.addEventListener("click",()=>{

        const month =
          parseInt(button.dataset.month);

        showDays(month);

      });

    });

    // SHOW DAYS

    function showDays(month){

      const daysContainer =
        document.getElementById("daysContainer");

      daysContainer.innerHTML = "";

      const totalDays =
        new Date(2026, month, 0).getDate();

      for(let day = 1; day <= totalDays; day++){

        const dayBox =
          document.createElement("div");

        dayBox.className = "day-box";

        dayBox.innerHTML = day;

        dayBox.onclick = ()=>{

          showAlbum(month, day);

        };

        daysContainer.appendChild(dayBox);

      }

    }

    // ADD PHOTO

    function addPhoto(){

      const imageInput =
        document.getElementById("imageInput");

      const captionInput =
        document.getElementById("captionInput");

      const files =
        imageInput.files;

      if(files.length === 0){

        alert("Vui lòng chọn ảnh!");
        return;
      }

      if(files.length > 20){

        alert("Chỉ được đăng tối đa 20 ảnh!");
        return;
      }

      const now = new Date();

      const year = now.getFullYear();

      const month = now.getMonth() + 1;

      const day = now.getDate();

      const hours =
        now.getHours().toString().padStart(2,"0");

      const minutes =
        now.getMinutes().toString().padStart(2,"0");

      const time =
        `${hours}:${minutes}`;

      const key =
        `${year}-${month}-${day}`;

      if(!albums[key]){

        albums[key] = [];

      }

      const post = {

        time: time,

        caption:
          captionInput.value || "Không có caption",

        images: []

      };

      let loaded = 0;

      Array.from(files).forEach(file=>{

        const reader =
          new FileReader();

        reader.onload = function(e){

          post.images.push(e.target.result);

          loaded++;

          if(loaded === files.length){

            albums[key].push(post);

            renderAllAlbums();

          }

        };

        reader.readAsDataURL(file);

      });

      imageInput.value = "";

      captionInput.value = "";

    }

    // RENDER ALL

    function renderAllAlbums(){

      const gallery =
        document.getElementById("gallery");

      gallery.innerHTML = "";

      const sortedKeys =
        Object.keys(albums)
        .sort((a,b)=> new Date(b)-new Date(a));

      sortedKeys.forEach(key=>{

        createAlbumCard(key);

      });

    }

    // CREATE CARD

    function createAlbumCard(key){

      const gallery =
        document.getElementById("gallery");

      const card =
        document.createElement("div");

      card.className = "card";

      const date =
        document.createElement("div");

      date.className = "date";

      date.innerHTML =
        `📅 ${key}`;

      card.appendChild(date);

      // sort theo thời gian

      albums[key]
      .sort((a,b)=>
        b.time.localeCompare(a.time)
      );

      albums[key].forEach(post=>{

        const block =
          document.createElement("div");

        block.className = "post-block";

        const caption =
          document.createElement("div");

        caption.className = "caption";

        caption.innerHTML = `
          🕒 ${post.time}
          <br><br>
          ✨ ${post.caption}
        `;

        block.appendChild(caption);

        const grid =
          document.createElement("div");

        grid.className = "album-grid";

        post.images.forEach(src=>{

          const img =
            document.createElement("img");

          img.src = src;

          img.onclick = ()=>{

            openImage(src);

          };

          grid.appendChild(img);

        });

        block.appendChild(grid);

        card.appendChild(block);

      });

      gallery.prepend(card);

    }

    // SHOW SINGLE DAY

    function showAlbum(month, day){

      const gallery =
        document.getElementById("gallery");

      gallery.innerHTML = "";

      const key =
        `2026-${month}-${day}`;

      if(!albums[key]){

        gallery.innerHTML = `

          <div class="card">

            <div class="date">
              📅 ${day}/${month}/2026
            </div>

            <div class="caption">
              Chưa có ảnh trong ngày này
            </div>

          </div>

        `;

        return;
      }

      createAlbumCard(key);

    }

    // FULLSCREEN

    function openImage(src){

      const modal =
        document.getElementById("modal");

      const modalImg =
        document.getElementById("modalImg");

      modalImg.src = src;

      modal.classList.add("active");

    }

    // CLOSE

    function closeImage(){

      document
        .getElementById("modal")
        .classList.remove("active");

    }

  </script>

</body>
</html>
```
