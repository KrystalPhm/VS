<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daily Photo Blog</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      background:#081120;
      color:white;
      padding:40px 8%;
    }

    h1{
      text-align:center;
      font-size:42px;
      margin-bottom:10px;
      color:#5ea2ff;
    }

    .subtitle{
      text-align:center;
      color:#9db2d1;
      margin-bottom:50px;
    }

    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
    }

    .card{
      background:#101b2f;
      border-radius:18px;
      overflow:hidden;
      transition:0.3s;
      border:1px solid rgba(255,255,255,0.05);
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card img{
      width:100%;
      height:300px;
      object-fit:cover;
    }

    .content{
      padding:18px;
    }

    .date{
      color:#5ea2ff;
      font-size:14px;
      margin-bottom:8px;
    }

    .caption{
      color:#d7e3f7;
      font-size:15px;
    }

    .upload-box{
      background:#101b2f;
      border-radius:20px;
      padding:30px;
      margin-bottom:50px;
      text-align:center;
      border:2px dashed #2c4c7a;
    }

    .upload-box input{
      margin-top:15px;
      color:white;
    }

    button{
      margin-top:20px;
      padding:12px 28px;
      border:none;
      border-radius:30px;
      background:#1d4ed8;
      color:white;
      cursor:pointer;
      font-size:15px;
      transition:0.3s;
    }

    button:hover{
      background:#2563eb;
    }

    footer{
      text-align:center;
      margin-top:60px;
      color:#7f95b8;
      font-size:14px;
    }
  </style>
</head>

<body>

  <h1>My Daily Moments</h1>
  <p class="subtitle">
    Blog đơn giản để lưu lại hình ảnh mỗi ngày ✨
  </p>

  ```html
<script>

  function addPhoto(){

    const imageInput = document.getElementById("imageInput");
    const captionInput = document.getElementById("captionInput");
    const gallery = document.getElementById("gallery");

    const files = imageInput.files;

    // kiểm tra có chọn ảnh chưa
    if(files.length === 0){
      alert("Vui lòng chọn ảnh!");
      return;
    }

    // giới hạn 20 ảnh
    if(files.length > 20){
      alert("Chỉ được tải tối đa 20 ảnh!");
      return;
    }

    // lặp qua từng ảnh
    Array.from(files).forEach(file => {

      const reader = new FileReader();

      reader.onload = function(e){

        const card = document.createElement("div");
        card.className = "card";

        const today = new Date().toLocaleDateString("vi-VN");

        card.innerHTML = `
          <div style="position:relative;">

            <img src="${e.target.result}">

            <!-- nút xóa -->
            <button 
              onclick="deletePost(this)"
              style="
                position:absolute;
                top:10px;
                right:10px;
                background:red;
                width:40px;
                height:40px;
                border-radius:50%;
                border:none;
                color:white;
                font-size:18px;
                cursor:pointer;
              ">
              ×
            </button>

          </div>

          <div class="content">
            <div class="date">${today}</div>

            <div class="caption">
              ${captionInput.value || "Không có caption"}
            </div>
          </div>
        `;

        gallery.prepend(card);
      };

      reader.readAsDataURL(file);

    });

    // reset input
    imageInput.value = "";
    captionInput.value = "";
  }

  // hàm xóa bài
  function deletePost(button){

    const card = button.closest(".card");

    card.remove();
  }

</script>

  <script>
    function addPhoto(){

      const imageInput = document.getElementById("imageInput");
      const captionInput = document.getElementById("captionInput");
      const gallery = document.getElementById("gallery");

      const file = imageInput.files[0];

      if(!file){
        alert("Vui lòng chọn ảnh!");
        return;
      }

      const reader = new FileReader();

      reader.onload = function(e){

        const card = document.createElement("div");
        card.className = "card";

        const today = new Date().toLocaleDateString("vi-VN");

        card.innerHTML = `
          <img src="${e.target.result}">
          <div class="content">
            <div class="date">${today}</div>
            <div class="caption">
              ${captionInput.value || "Không có caption"}
            </div>
          </div>
        `;

        gallery.prepend(card);

        imageInput.value = "";
        captionInput.value = "";
      };

      reader.readAsDataURL(file);
    }
  </script>
